    <rect x="12" y="12" width="16" height="16" rx="3"/>
    <rect x="34" y="12" width="16" height="16" rx="3"/>
    <rect x="56" y="12" width="16" height="16" rx="3"/>
    <rect x="12" y="34" width="16" height="16" rx="3"/>
    <rect x="56" y="34" width="16" height="16" rx="3"/>
    <rect x="12" y="56" width="16" height="16" rx="3"/>
    <rect x="34" y="56" width="16" height="16" rx="3"/>
    <rect x="56" y="56" width="16" height="16" rx="3"/>
    <rect x="12" y="78" width="16" height="16" rx="3" fill="#6366F1"/>
  </g>
</svg>